<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- %VITE_CSP_SCRIPT_EXTRA% is empty in production; in dev it allows the
         inline React-refresh preamble that Vite injects (.env.development) -->
    <!-- img-src allows data: so the pairing QR (a PNG data URL rendered in main)
         displays; the raw secret still never enters renderer JS state. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; %VITE_CSP_DEV_DIRECTIVES%script-src 'self'%VITE_CSP_SCRIPT_EXTRA%; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: http://localhost:*"
    />
    <title>FolderSync</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
